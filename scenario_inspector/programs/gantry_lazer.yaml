program:
  name: "lazer_test"
  description: "Laser scanning"
  piece_info:
    name_piece: "Landing gear"
    ref_piece: "0054-0544"
  
  stages:
    - stage: 1
      name: "lazer-gantry"
      together: true        
      steps:
        - step: 1
          name: "lazer"
          system: "scanControl"
          parameters:
            param1: 1300
            param2: "ex"
          action: "recording_data"
          recording_time: 20
        - step: 2
          name: "gantry"
          system: "gantry"
          action: "load_and_run"
          program_name: "simpheenenweer.xml"
